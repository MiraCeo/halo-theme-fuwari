apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-fuwari-miraceo-setting
spec:
  forms:
    - group: base
      label: 基础设置
      formSchema:
        - $formkit: group
          name: navbar
          label: 导航栏标题
          value:
            enable_custom_title: false
            custom_title: ""
          children:
            - $formkit: switch
              name: enable_custom_title
              label: 启用自定义标题
              value: true
              help: "启用后，导航栏左上角将显示下方填写的自定义标题"
            - $formkit: text
              name: custom_title
              label: 自定义标题
              value: ""
              placeholder: "请输入导航栏标题"
              help: "未启用或内容为空时，将显示网站标题"

        - $formkit: group
          name: themeColor
          label: 主题颜色
          value:
            color: "#E28247"
            fixed: false
          children:
            - $formkit: text
              name: color
              label: 主题颜色
              value: "#E28247"
              placeholder: "#E28247 或 rgb(226, 130, 71)"
              help: "支持 HEX（#RGB、#RRGGBB）或 RGB（rgb(226, 130, 71)）格式"
            - $formkit: switch
              name: fixed
              label: 固定主题颜色
              value: false
              help: "隐藏访问者的主题彩色选择器"

        - $formkit: group
          name: banner
          label: Banner
          value:
            enable: true
            src: "/themes/theme-fuwari-miraceo/assets/images/demo-banner.jpg"
            position: "center"
            credit:
              enable: false
              text: "© 2022 Fuwari"
              url: ""
          children:
            - $formkit: switch
              name: enable
              label: 启用
              value: true
              help: "启用横幅"
            - $formkit: attachment
              name: src
              label: 图片
              value: "/themes/theme-fuwari-miraceo/assets/images/demo-banner.jpg"
              help: "显示的图像"
            - $formkit: select
              name: position
              label: 位置
              value: "center"
              options:
                - value: center
                  label: 居中
                - value: top
                  label: 顶部
                - value: bottom
                  label: 底部
            - $formkit: group
              name: credit
              label: 版权信息
              children:
                - $formkit: switch
                  name: enable
                  label: 启用
                  value: false
                  help: "启用版权信息"
                - $formkit: text
                  name: text
                  label: 文字
                  value: "© 2022 Fuwari"
                  help: "显示的文字"
                - $formkit: url
                  name: url
                  label: 链接
                  value:

        - $formkit: menuRadio
          id: menu
          name: menu
          label: 菜单
          value: ""
          help: "选择菜单(仅支持一级菜单)"

    - group: style
      label: 样式
      formSchema:
        - $formkit: select
          name: color_scheme
          label: 默认配色
          value: auto
          options:
            - label: 跟随系统
              value: auto
            - label: 深色
              value: dark
            - label: 浅色
              value: light

        - $formkit: switch
          name: enable_change_color_scheme
          label: 允许访客切换配色
          value: true

        - $formkit: group
          name: typography
          label: 字体
          value:
            font_family: system
            custom_font_family: ""
            custom_font_stylesheet: ""
          children:
            - $formkit: select
              name: font_family
              label: 页面字体
              value: system
              options:
                - label: 系统无衬线字体
                  value: system
                - label: Roboto
                  value: roboto
                - label: 系统衬线字体
                  value: serif
                - label: 系统等宽字体
                  value: monospace
                - label: 自定义字体
                  value: custom
            - $formkit: text
              if: $value.font_family === custom
              name: custom_font_family
              label: 自定义字体名称
              placeholder: '"Noto Sans SC", sans-serif'
              help: "填写 CSS font-family 值；建议保留通用字体作为回退"
            - $formkit: url
              if: $value.font_family === custom
              name: custom_font_stylesheet
              label: 字体样式表地址
              placeholder: "https://example.com/font.css"
              help: "可选。填写提供 @font-face 的 HTTPS CSS 地址"

    - group: sidebar
      label: 侧边栏
      formSchema:
        - $formkit: array
          name: widgets
          label: 小部件
          value:
            - value: categories
            - value: tag
          children:
            - $formkit: select
              name: value
              id: widgets_value
              label: 部件
              options:
                - label: 热门文章（TODO）
                  value: popular-posts
                - label: 文章分类
                  value: categories
                - label: 文章标签
                  value: tag
                - label: 自定义HTML
                  value: html
            - $formkit: code
              if: $value.value === html
              name: html
              label: HTML
              value: "<p>自定义HTML</p>"
              language: html

    - group: music
      label: 音乐
      formSchema:
        - $formkit: switch
          name: enable
          label: 启用音乐
          value: false
          help: "关闭后本站不再加载任何音乐功能"

        - $formkit: text
          name: title
          label: 标题
          value: 音乐
          help: "侧边栏播放器的标题"

        - $formkit: group
          name: custom_tracks
          label: 自定义曲目列表（推荐）
          value:
            enable: false
          children:
            - $formkit: switch
              name: enable
              label: 启用
              value: false
              help: "与 Meting API 同时启用时以此为准"
            - $formkit: array
              name: items
              label: 曲目
              addLabel: 添加曲目
              children:
                - $formkit: attachment
                  name: audio
                  label: 音频
                  help: "留空标题时用文件名作为曲名"
                - $formkit: text
                  name: name
                  label: 标题
                  help: "留空则自动取音频文件名"
                - $formkit: attachment
                  name: cover
                  label: 封面
                - $formkit: textarea
                  name: lyrics
                  label: 歌词
                  rows: 4
                  help: "一行一句，可选。行首带 [分:秒.百分秒] 时歌词跟随播放高亮"

        - $formkit: group
          name: meting
          label: Meting API
          value:
            enable: false
            server: netease
            type: playlist
          children:
            - $formkit: switch
              name: enable
              label: 启用
              value: false
            - $formkit: text
              if: $value.enable === true
              name: api
              label: 接口地址
              placeholder: "https://你的域名/meting/?server=:server&type=:type&id=:id"
              help: |-
                Meting 是统一各音乐平台接口的开源项目，需自行部署成服务，公开镜像即他人部署的此类服务。
                公开镜像随时可能失效，且播放内容属于未授权分发，风险自负。
            - $formkit: select
              if: $value.enable === true
              name: server
              label: 平台
              value: netease
              options:
                - label: 网易云音乐
                  value: netease
                - label: QQ 音乐
                  value: tencent
                - label: 酷狗音乐
                  value: kugou
                - label: 虾米音乐
                  value: xiami
                - label: 百度音乐
                  value: baidu
            - $formkit: select
              if: $value.enable === true
              name: type
              label: 类型
              value: playlist
              options:
                - label: 歌曲
                  value: song
                - label: 歌单
                  value: playlist
                - label: 专辑
                  value: album
                - label: 歌手
                  value: artist
                - label: 搜索
                  value: search
            - $formkit: text
              if: $value.enable === true
              name: id
              label: ID
              help: 歌曲 / 歌单 / 专辑 / 歌手 ID，搜索类型时填写关键词

        - $formkit: select
          name: play_mode
          label: 播放模式
          value: list
          options:
            - label: 列表循环
              value: list
            - label: 单曲循环
              value: one
            - label: 随机
              value: random

        - $formkit: number
          name: volume
          label: 默认音量
          min: 0
          max: 1
          step: 0.1
          value: 0.7
          help: "0 到 1 之间，0.7 即 70%"

        - $formkit: switch
          name: autoplay
          label: 自动播放
          value: false
          help: "多数浏览器只允许有过交互的访客自动播放，首次访问通常仍需点击播放按钮"

        - $formkit: switch
          name: show_lyrics
          label: 歌词
          value: false
          help: "显示歌词按钮。曲目没填歌词时按钮自动隐藏"

        - $formkit: switch
          name: show_toggle
          label: 显示顶栏按钮
          value: true
          help: "滚动后顶栏会隐藏，长文阅读时请保留侧边栏播放器"

        - $formkit: switch
          name: show_sidebar
          label: 添加到侧边栏
          value: true
          help: "关闭后播放器仍在运行，只是不在侧边栏显示，顶栏按钮仍可使用"

    - group: profile
      label: 个人设置
      formSchema:
        - $formkit: switch
          name: enable_profile
          value: true
          label: 启用个人设置

        - $formkit: attachment
          name: avatar
          value: /themes/theme-fuwari-miraceo/assets/images/demo-avatar.jpg
          label: 头像

        - $formkit: text
          name: name
          label: 昵称
          value: Fuwari-MiraCeo

        - $formkit: text
          name: bio
          label: 简介
          value: "一刻千金"
        - $formkit: url
          name: url
          label: 链接(点击跳转登录和后台可使用 /login )
          value: /about

        - $formkit: array
          name: social_media
          label: 社交媒体

          children:
            - $formkit: iconify
              name: social_icon
              label: 社交图标
              format: svg # svg / dataurl / url / name
            - $formkit: text
              name: name
              label: 名称
            - $formkit: text
              name: url
              label: 链接
              validation: "required"

    - group: post
      label: 文章
      formSchema:
        - $formkit: group
          name: license
          label: 版权声明
          value:
            enable: false
            name: CC BY-NC-SA 4.0
            url: https://creativecommons.org/licenses/by-nc-sa/4.0/
          children:
            - $formkit: switch
              name: enable
              label: 启用
              value: false
              help: "启用版权声明"
            - $formkit: text
              name: name
              label: 名称
              value: CC BY-NC-SA 4.0
            - $formkit: url
              name: url
              label: 链接
              value: https://creativecommons.org/licenses/by-nc-sa/4.0/
        - $formkit: select
          name: content_size
          label: 字体大小
          value: prose-base
          options:
            - value: prose-base
              label: prose-base
            - value: prose-sm
              label: prose-sm
            - value: prose-lg
              label: prose-lg
            - value: prose-xl
              label: prose-xl
            - value: prose-2xl
              label: prose-2xl
        - $formkit: select
          name: content_theme
          label: 颜色主题
          value: prose-gray
          options:
            - value: prose-gray
              label: prose-gray
            - value: prose-slate
              label: prose-slate
            - value: prose-zinc
              label: prose-zinc
            - value: prose-neutral
              label: prose-neutral
            - value: prose-stone
              label: prose-stone
        - $formkit: switch
          name: enable_toc
          label: 启用目录
          value: true
          help: "启用目录"
        - $formkit: number
          name: toc_depth
          label: 目录最大深度
          value: 2
          help: "目录的最大深度"
    - group: beian
      label: 备案设置
      formSchema:
        - $formkit: text
          name: icp_text
          label: ICP备案号
        - $formkit: text
          name: icp_link
          label: ICP备案跳转链接
          value: https://beian.miit.gov.cn/

        - $formkit: text
          name: gongan_text
          label: 公安联网备案号
        - $formkit: text
          name: gongan_link
          label: 公安联网备案跳转链接
          value: https://beian.mps.gov.cn/#/query/webSearch
